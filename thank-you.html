<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Message Sent | syncIO Labs</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Albert+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/site.css" />
    <style>
      body { align-items: center; justify-content: center; }
      body::before { display: none; }
      .confirmation { text-align: center; max-width: 500px; padding: 2rem; margin: auto; }
      .check-icon { width: 64px; height: 64px; border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: var(--gold); }
      .confirmation h1 { font-size: 2rem; margin-bottom: 0.75rem; }
      .confirmation p { color: var(--gray-light); font-size: 1.05rem; margin: 0 auto 0.5rem; }
      .redirect-note { font-size: 0.85rem; color: var(--gray); margin-top: 2rem; }
      .progress-bar { width: 120px; height: 2px; background: var(--line); margin: 1rem auto 0; overflow: hidden; }
      .progress-fill { height: 100%; background: var(--gold); width: 0%; animation: fillBar 5s linear forwards; }
      @keyframes fillBar { from { width: 0%; } to { width: 100%; } }
    </style>
  </head>
  <body>
    <div class="confirmation">
      <div class="check-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
      </div>
      <h1>Message <span class="highlight">sent.</span></h1>
      <p>We'll get back to you within 24 hours.</p>
      <div class="redirect-note">Taking you back to the platform overview…</div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>
    <script>setTimeout(function () { window.location.href = '/platform'; }, 5000);</script>
  </body>
</html>
